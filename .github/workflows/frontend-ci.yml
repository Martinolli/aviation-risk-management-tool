name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Production Build
        run: npm run build

  frontend-smoke:
    name: Frontend Vite Preview Smoke Tests
    needs: frontend-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Start Vite Preview and check root route
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/frontend-preview.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4174/ > /tmp/frontend-root.html; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:4174/ > /tmp/frontend-root.html || {
            cat /tmp/frontend-preview.log
            exit 1
          }

          grep -q '<div id="root">' /tmp/frontend-root.html || {
            cat /tmp/frontend-root.html
            exit 1
          }
